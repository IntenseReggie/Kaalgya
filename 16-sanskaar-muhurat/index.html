        async function fetchYearlyDrawer(muhuratId) {
            const modal = document.getElementById("yearlyMuhuratModal");
            const body = document.getElementById("modalMuhuratBody");
            const year = document.getElementById("muhuratYearInput")?.value || new Date().getFullYear();

            modal.style.display = "flex";
            body.innerHTML = isMuhuratHindi
                ? "<p class='text-gold-400'>⏳ 12 महीनों की शुद्ध शास्त्रीय गणना की जा रही है...</p>"
                : "<p class='text-gold-400'>⏳ Calculating 12-month Shastric Muhurat alignments...</p>";

            try {
                const res = await fetch(`${KAALGYA_BACKEND_URL}?action=getYearlyMuhurats&year=${year}&muhuratId=${muhuratId}`);
                const data = await res.json();

                document.getElementById("modalMuhuratTitle").innerText = isMuhuratHindi
                    ? `📅 ${data.muhuratName} • वर्ष ${data.year} (${data.totalDatesFound} शुद्ध मुहूर्त प्राप्त)`
                    : `📅 ${data.muhuratName} • Year ${data.year} (${data.totalDatesFound} Verified Muhurats Found)`;

                let html = "";
                for (const [month, dates] of Object.entries(data.monthlyDirectory || {})) {
                    html += `<div class="font-bold text-gold-300 mt-3 mb-2 text-xs uppercase border-b border-gold-500/20 pb-1">✦ ${month}</div>`;
                    html += "<div class='grid grid-cols-1 sm:grid-cols-2 gap-2'>";
                    dates.forEach(d => {
                        const weight = d.weightage || 85;
                        const advice = weight >= 85
                            ? (isMuhuratHindi
                                ? `<span class="text-emerald-300 font-semibold">✓ इस मुहूर्त का उपयोग करना उत्तम व प्रशस्त है।</span>`
                                : `<span class="text-emerald-300 font-semibold">✓ Highly recommended & auspicious window.</span>`)
                            : (isMuhuratHindi
                                ? `<span class="text-amber-300 font-semibold">⚠️ अपने स्थानीय गुरु या ज्योतिष की सलाह पर ही काम करें।</span>`
                                : `<span class="text-amber-300 font-semibold">⚠️ Moderate alignment; consult your spiritual guide.</span>`);

                        html += `
                            <div class="p-2.5 rounded-xl bg-obsidian-900 border border-gold-500/25 text-[11px] space-y-1">
                                <div class="flex justify-between items-center text-white font-bold">
                                    <span>📅 ${d.formattedDate}</span>
                                    <span class="text-gold-400 text-[10px]">Weightage: ${weight}%</span>
                                </div>
                                <div class="text-gray-300">${isMuhuratHindi ? 'शुभ समय:' : 'Auspicious Time:'} ${d.timeSpan}</div>
                                <div class="text-gray-400 text-[10px]">${isMuhuratHindi ? 'तिथि:' : 'Tithi:'} ${d.tithi} • ${isMuhuratHindi ? 'नक्षत्र:' : 'Nakshatra:'} ${d.nakshatra}</div>
                                <div class="pt-1 border-t border-gold-500/10 text-[10px]">${advice}</div>
                            </div>
                        `;
                    });
                    html += "</div>";
                }
                body.innerHTML = html || (isMuhuratHindi
                    ? "<p>इस वर्ष में शुद्ध शास्त्रीय मुहूर्त के अनुकूल दिन सीमित हैं।</p>"
                    : "<p>Limited auspicious windows available for this year.</p>");
            } catch (e) {
                body.innerHTML = isMuhuratHindi
                    ? "<p class='text-rose-400'>त्रुटि: डेटा लोड नहीं हो सका।</p>"
                    : "<p class='text-rose-400'>Error: Unable to fetch calendar data.</p>";
            }
        }

        function toggleMuhuratLang() {
            isMuhuratHindi = !isMuhuratHindi;
            localStorage.setItem("kaalgya_lang", isMuhuratHindi ? "hi" : "en");
            applyMuhuratLabels();
        }

        document.addEventListener("DOMContentLoaded", applyMuhuratLabels);
    </script>
</body>
</html>
