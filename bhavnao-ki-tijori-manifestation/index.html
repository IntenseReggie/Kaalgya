<!DOCTYPE html>
<html lang="hi" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>भावनाओं की तिजोरी | Vedic Manifestation & Intention Vault — KAALGYA</title>
    <meta name="description" content="15+ वर्षों के शास्त्रसम्मत अनुभव के साथ KAALGYA की भावनाओं की तिजोरी (Vedic Manifestation & Intention Vault)—अपनी इच्छा, संकल्प और भाव समर्पित करें।">
    <link rel="canonical" href="https://kaalgya.com/bhavnao-ki-tijori-manifestation/">
    <meta name="robots" content="index, follow, max-image-preview:large">
    <meta name="theme-color" content="#030305">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700;800&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        gold: { 200: '#FDEBB3', 300: '#FBDD80', 400: '#F9CF4D', 500: '#D4AF37', 600: '#B8860B' },
                        obsidian: { 950: '#020204', 900: '#05060A' }
                    },
                    fontFamily: {
                        cinzel: ['Cinzel', 'serif'],
                        sans: ['Plus Jakarta Sans', 'sans-serif']
                    }
                }
            }
        }
    </script>

    <style>
        body {
            background-color: #030305;
            color: #E2E8F0;
            overflow-x: hidden;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }
        .gold-gradient-text {
            background: linear-gradient(135deg, #FFF9E6 0%, #F5D061 30%, #D4AF37 60%, #AA771C 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .cosmic-glass {
            background: rgba(10, 12, 18, 0.94);
            backdrop-filter: blur(16px);
        }
        .gold-border-glow {
            border: 1px solid rgba(212, 175, 55, 0.35);
            box-shadow: 0 0 30px rgba(212, 175, 55, 0.12);
        }
    </style>
</head>
<body class="selection:bg-gold-500 selection:text-black min-h-screen">

    <!-- Header -->
    <header class="sticky top-0 z-40 cosmic-glass border-b border-gold-500/20 px-4 lg:px-10 py-3">
        <div class="max-w-7xl mx-auto flex items-center justify-between gap-2 sm:gap-3">
            <a href="https://kaalgya.com/" class="flex items-center gap-3">
                <div class="relative w-11 h-11 rounded-full border-2 border-gold-500/80 bg-black overflow-hidden flex-shrink-0">
                    <video autoplay loop muted playsinline class="absolute pointer-events-none max-w-none rounded-full" style="width: 197%; height: 197%; object-fit: contain; top: 50%; left: 50%; transform: translate(-49.6%, -44%);">
                        <source src="https://kaalgya.com/logo.mp4" type="video/mp4">
                    </video>
                </div>
                <div>
                    <span class="font-cinzel font-black text-xl gold-gradient-text block leading-none">KAALGYA</span>
                    <span class="text-[8px] tracking-[0.18em] text-gold-300 font-semibold uppercase mt-1 block">Ancient Wisdom • Modern Intelligence</span>
                </div>
            </a>

            <div class="flex items-center gap-2 sm:gap-3">
                <button id="tijori-lang-btn" type="button" onclick="toggleTijoriLanguage()" class="px-3 py-2 rounded-xl border border-gold-500/40 bg-obsidian-900 text-gold-300 text-xs font-bold hover:bg-gold-500 hover:text-black transition-all cursor-pointer">
                    English
                </button>
                <a href="https://kaalgya.com/" id="tijori-return-btn" class="px-3.5 py-2 rounded-xl border border-gold-500/50 bg-obsidian-900 text-gold-300 text-xs font-bold hover:border-gold-400 hover:text-white transition-colors">
                    ← मुख्य पृष्ठ
                </a>
                <a href="https://forms.gle/TqZrbxcDQFmxy6iH9" target="_blank" rel="noopener noreferrer" id="tijori-consult-btn" class="px-4 py-2 rounded-xl bg-gold-500 hover:bg-gold-400 text-black font-extrabold text-xs uppercase">
                    परामर्श लें
                </a>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="py-10 px-4 max-w-4xl mx-auto space-y-8">

        <!-- Banner -->
        <div class="w-full rounded-3xl overflow-hidden border border-gold-500/40 bg-obsidian-950 shadow-xl">
            <img src="https://kaalgya.com/banner-tijori.jpg" onerror="this.src='https://kaalgya.com/banner-panchang.jpg'" alt="भावनाओं की तिजोरी - Vedic Manifestation & Intention Vault" class="w-full h-48 sm:h-64 object-cover object-center opacity-85">
        </div>

        <!-- Heading Box -->
        <div class="cosmic-glass gold-border-glow rounded-3xl p-6 md:p-10 text-center overflow-visible space-y-4">
            <span id="tijori-badge" class="px-4 py-1 rounded-full bg-gold-500/20 text-gold-300 text-xs font-bold uppercase tracking-widest border border-gold-400/40 inline-block">
                Vedic Manifestation & Intention Vault
            </span>
            <h1 id="tijori-title" class="text-2xl sm:text-4xl font-bold font-cinzel gold-gradient-text leading-[1.85] py-1 overflow-visible">
                भावनाओं की तिजोरी • Manifestation Vault
            </h1>
            <p id="tijori-subtitle" class="text-xs sm:text-sm text-gold-200 font-serif italic max-w-2xl mx-auto leading-relaxed">
                "यह कालज्ञ के विशेष दिशा यंत्र, कार्तवीर्जुन यंत्र एवं नृसिंह यंत्र के चैतन्य ऊर्जा-मंडल से अभिमंत्रित स्थान है।"
            </p>
        </div>

        <!-- Form Card -->
        <section class="cosmic-glass border-2 border-gold-400/60 rounded-3xl p-6 md:p-10 shadow-2xl">
            <form onsubmit="submitDedicatedTijori(event)" class="space-y-4 max-w-2xl mx-auto">
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div>
                        <label id="lbl-name" class="block text-xs text-gold-300 font-semibold mb-1">आपका नाम *</label>
                        <input id="tijori-name" type="text" required placeholder="जैसे: अमित शर्मा" class="w-full px-4 py-2.5 rounded-xl bg-obsidian-900 border border-gold-500/30 text-white text-xs">
                    </div>
                    <div>
                        <label id="lbl-phone" class="block text-xs text-gold-300 font-semibold mb-1">व्हाट्सएप मोबाइल नंबर *</label>
                        <input id="tijori-phone" type="tel" required placeholder="10-digit mobile" class="w-full px-4 py-2.5 rounded-xl bg-obsidian-900 border border-gold-500/30 text-white text-xs">
                    </div>
                </div>

                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div>
                        <label id="lbl-email" class="block text-xs text-gold-300 font-semibold mb-1">आपकी ईमेल आईडी *</label>
                        <input id="tijori-email" type="email" required placeholder="name@domain.com" class="w-full px-4 py-2.5 rounded-xl bg-obsidian-900 border border-gold-500/30 text-white text-xs">
                    </div>
                    <div>
                        <label id="lbl-cat" class="block text-xs text-gold-300 font-semibold mb-1">भावना की श्रेणी *</label>
                        <select id="tijori-category" class="w-full px-4 py-2.5 rounded-xl bg-obsidian-900 border border-gold-500/30 text-white text-xs font-semibold">
                            <option id="opt-wish" value="WISH MANIFESTATION">मेरी मनोकामना / Manifestation</option>
                            <option id="opt-pain" value="HEAVY PAIN / DUKH">गहरा दुख / मन की पीड़ा</option>
                            <option id="opt-secret" value="SECRET / GOPEENIYA">अति गोपनीय रहस्य</option>
                            <option id="opt-conflict" value="DIFFICULT CONFLICT">जीवन का अनिर्णय / द्वंद्व</option>
                        </select>
                    </div>
                </div>

                <div>
                    <label id="lbl-msg" class="block text-xs text-gold-300 font-semibold mb-1">मन की पूरी बात विस्तार से लिखें *</label>
                    <textarea id="tijori-message" rows="5" required placeholder="जो बात आप किसी से नहीं कह पाते, उसे यहाँ ब्रह्मांड के सम्मुख समर्पित करें..." class="w-full px-4 py-2.5 rounded-xl bg-obsidian-900 border border-gold-500/30 text-white text-xs"></textarea>
                </div>

                <button id="tijori-submit-btn" type="submit" class="w-full py-3.5 rounded-xl bg-gradient-to-r from-gold-500 to-amber-600 text-black font-extrabold text-xs uppercase tracking-wider cursor-pointer shadow-xl">
                    Submit to Universe
                </button>
            </form>
        </section>

        <!-- Bottom Return Link -->
        <div class="pt-2 text-center">
            <a href="https://kaalgya.com/" id="tijori-bottom-return" class="inline-block px-8 py-3.5 rounded-xl bg-gold-500 hover:bg-gold-400 text-black font-extrabold text-xs uppercase tracking-wider">
                ← मुख्य पृष्ठ पर वापस जाएं
            </a>
        </div>
    </main>

    <script>
        const KAALGYA_BACKEND_URL = "https://script.google.com/macros/s/AKfycbw9PfIaOjI31X8cQh17Q6Q4EBH2HA2T4ngpGsm4HxPA-m4gJyLF4cuEXxOXdq3IyDE/exec";

        let isTijoriHindi = localStorage.getItem("kaalgya_lang") !== null
            ? (localStorage.getItem("kaalgya_lang") === "hi")
            : true;

        function applyTijoriLang() {
            document.documentElement.lang = isTijoriHindi ? "hi" : "en";
            document.getElementById("tijori-lang-btn").innerText = isTijoriHindi ? "English" : "हिन्दी";
            document.getElementById("tijori-return-btn").innerText = isTijoriHindi ? "← मुख्य पृष्ठ" : "← Main Page";
            document.getElementById("tijori-bottom-return").innerText = isTijoriHindi ? "← मुख्य पृष्ठ पर वापस जाएं" : "← Back to Main Page";
            document.getElementById("tijori-consult-btn").innerText = isTijoriHindi ? "परामर्श लें" : "Consult Now";
            document.getElementById("tijori-badge").innerText = "Vedic Manifestation & Intention Vault";
            document.getElementById("tijori-title").innerText = isTijoriHindi
                ? "भावनाओं की तिजोरी • Manifestation Vault"
                : "Bhavnaon Ki Tijori • Manifestation Vault";
            document.getElementById("tijori-subtitle").innerText = isTijoriHindi
                ? '"यह कालज्ञ के विशेष दिशा यंत्र, कार्तवीर्जुन यंत्र एवं नृसिंह यंत्र के चैतन्य ऊर्जा-मंडल से अभिमंत्रित स्थान है।"'
                : '"Consecrated within the energetic field of Kaalgya\'s Disha, Kartavirya Arjuna, and Narsimha Yantras."';
            document.getElementById("lbl-name").innerText = isTijoriHindi ? "आपका नाम *" : "Your Name *";
            document.getElementById("lbl-phone").innerText = isTijoriHindi ? "व्हाट्सएप मोबाइल नंबर *" : "WhatsApp Mobile Number *";
            document.getElementById("lbl-email").innerText = isTijoriHindi ? "आपकी ईमेल आईडी *" : "Your Email ID *";
            document.getElementById("lbl-cat").innerText = isTijoriHindi ? "भावना की श्रेणी *" : "Manifestation / Intention Category *";
            document.getElementById("opt-wish").innerText = isTijoriHindi ? "मेरी मनोकामना / Manifestation" : "My Wish / Manifestation";
            document.getElementById("opt-pain").innerText = isTijoriHindi ? "गहरा दुख / मन की पीड़ा" : "Deep Pain / Inner Burden";
            document.getElementById("opt-secret").innerText = isTijoriHindi ? "अति गोपनीय रहस्य" : "Confidential / Private Note";
            document.getElementById("opt-conflict").innerText = isTijoriHindi ? "जीवन का अनिर्णय / द्वंद्व" : "Life Dilemma / Decision";
            document.getElementById("lbl-msg").innerText = isTijoriHindi ? "मन की पूरी बात विस्तार से लिखें *" : "Write your intention or thoughts in detail *";
            document.getElementById("tijori-message").placeholder = isTijoriHindi
                ? "जो बात आप किसी से नहीं कह पाते, उसे यहाँ ब्रह्मांड के सम्मुख समर्पित करें..."
                : "Share your manifestation, intention, or inner thoughts with clarity...";
            document.getElementById("tijori-submit-btn").innerText = isTijoriHindi ? "Submit to Universe" : "Submit to Universe";
        }

        function toggleTijoriLanguage() {
            isTijoriHindi = !isTijoriHindi;
            localStorage.setItem("kaalgya_lang", isTijoriHindi ? "hi" : "en");
            applyTijoriLang();
        }

        async function submitDedicatedTijori(e) {
            e.preventDefault();
            const name = document.getElementById("tijori-name").value;
            const phone = document.getElementById("tijori-phone").value;
            const email = document.getElementById("tijori-email").value;
            const category = document.getElementById("tijori-category").value;
            const message = document.getElementById("tijori-message").value;

            const btn = document.getElementById("tijori-submit-btn");
            const oldText = btn.innerText;
            btn.innerText = isTijoriHindi ? "ब्रह्मांड में समर्पित हो रहा है..." : "Submitting...";
            btn.disabled = true;

            try {
                await fetch(KAALGYA_BACKEND_URL, {
                    method: "POST",
                    body: JSON.stringify({ type: "tijori", name, phone, email, category, message })
                });
                e.target.reset();
                alert(isTijoriHindi
                    ? "आपका भाव-समर्पित संदेश सफलतापूर्वक पहुँच गया है!"
                    : "Your manifestation/intention submission has been received successfully!");
            } catch (err) {
                const mailSubject = encodeURIComponent(`[Manifestation Vault] ${category} | ${name}`);
                const mailBody = encodeURIComponent(`Name: ${name}\nPhone: ${phone}\nEmail: ${email}\nCategory: ${category}\n\nMessage:\n${message}`);
                window.location.href = `mailto:kaalgya@gmail.com?subject=${mailSubject}&body=${mailBody}`;
                e.target.reset();
            } finally {
                btn.innerText = oldText;
                btn.disabled = false;
            }
        }

        document.addEventListener("DOMContentLoaded", applyTijoriLang);
    </script>
</body>
</html>
